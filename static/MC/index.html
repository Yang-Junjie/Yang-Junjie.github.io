<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>记忆回廊</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="gallery" id="gallery" aria-labelledby="galleryTitle">
        <header class="gallery-header">
          <p class="brand" id="galleryBrand">记忆回廊</p>
          <h1 id="galleryTitle">记忆回廊</h1>
        </header>
        <div class="article-list" id="articleList"></div>
      </section>

      <section class="unlock-panel" id="unlockPanel" aria-labelledby="unlockTitle" hidden>
        <p class="brand" id="selectedArticleLabel">记忆回廊</p>
        <h1 id="unlockTitle">输入解锁密钥</h1>
        <form id="unlockForm" class="unlock-form">
          <label for="unlockKey">解锁密钥</label>
          <div class="key-field">
            <input
              id="unlockKey"
              name="unlockKey"
              type="password"
              autocomplete="current-password"
              spellcheck="false"
              required
              autofocus
            >
            <button
              class="icon-button"
              id="toggleKey"
              type="button"
              aria-label="显示密钥"
              title="显示密钥"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.1 12s3.3-6.2 9.9-6.2S21.9 12 21.9 12s-3.3 6.2-9.9 6.2S2.1 12 2.1 12Z"></path>
                <circle cx="12" cy="12" r="2.7"></circle>
              </svg>
            </button>
          </div>
          <button id="unlockButton" class="primary-button" type="submit">解锁</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
        <button id="backButton" class="text-button" type="button">返回回廊</button>
      </section>

      <article class="reader" id="reader" hidden>
        <figure class="reader-cover" id="readerCover" hidden>
          <img id="readerCoverImage" alt="">
        </figure>
        <header class="reader-header">
          <div>
            <p class="reader-state">已解锁</p>
            <h1 id="novelTitle">玻璃窗口里的小麦</h1>
          </div>
          <button id="lockButton" class="secondary-button" type="button">锁定</button>
        </header>
        <div class="content" id="content"></div>
      </article>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
