name: Deploy CGLab to GitHub Pages

on:
  push:
    branches: [main, mizuki-blog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Mizuki v0.2.1
        run: |
          archive=mizuki-0.2.1-linux-x86_64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/Yang-Junjie/Mizuki/releases/download/v0.2.1/${archive}" \
            --output "${archive}"
          echo "7c63bcbcda9e5cae331fc30fb989c16759ab0f7141e0ab1b61de0d805a39ba52  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/mizuki-0.2.1-linux-x86_64/bin" >> "${GITHUB_PATH}"

      - name: Build CGLab
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: mizuki build --base-url "${PAGES_BASE_URL}"

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
