name: Deploy CGLab to GitHub Pages

on:
  push:
    branches: [main, mizuki-blog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - name: Check out Mizuki main
        uses: actions/checkout@v7
        with:
          repository: Yang-Junjie/Mizuki
          ref: refs/heads/main
          path: mizuki-source
          persist-credentials: false

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6

      - name: Build Mizuki from main
        run: |
          git -C mizuki-source log -1 --format='Mizuki source %H'
          cmake -S mizuki-source -B "${RUNNER_TEMP}/mizuki-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DMIZUKI_BUILD_DISTRIBUTION=ON
          cmake --build "${RUNNER_TEMP}/mizuki-build" --parallel 2 --target mizuki
          "${RUNNER_TEMP}/mizuki-build/bin/mizuki" --version
          echo "${RUNNER_TEMP}/mizuki-build/bin" >> "${GITHUB_PATH}"

      - name: Build CGLab
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: mizuki build --base-url "${PAGES_BASE_URL}"

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
