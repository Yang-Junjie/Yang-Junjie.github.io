{% if length(page.tags) > 0 or length(page.categories) > 0 %}
  <div class="post-taxonomies">
    {% if length(page.categories) > 0 %}
      <nav aria-label="文章分类">
        {% for entry in page.categories %}
          <a href="{{ entry.url }}">{{ entry.name }}</a>
        {% endfor %}
      </nav>
    {% endif %}

    {% if length(page.tags) > 0 %}
      <nav aria-label="文章标签">
        {% for entry in page.tags %}
          <a href="{{ entry.url }}" rel="tag">{{ entry.name }}</a>
        {% endfor %}
      </nav>
    {% endif %}
  </div>
{% endif %}
