{% extends "base.html" %}

{% block content %}
  <article class="document">
    <header class="document-header">
      <h1>{{ page.title }}</h1>
      <time datetime="{{ page.date }}">{{ page.date }}</time>
      {% include "partials/taxonomy-links.html" %}
    </header>

    {% include "partials/toc.html" %}

    <div class="article-content" data-markdown>
      {% include "partials/cover.html" %}
      {{ html(page.content) }}
    </div>

    {% include "partials/post-license.html" %}
  </article>
{% endblock %}
